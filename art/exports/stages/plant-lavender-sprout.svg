      </radialGradient></defs><style>.f-stemwrap{transform-origin:50% 120px;transform:scaleY(var(--sg,1))}
.f-leaves{transform-origin:50px 96px;transform:scale(var(--lg,1));opacity:var(--lo,1)}
.f-stemwrap,.f-head,.f-leaves,.f-petals{transition:transform .6s cubic-bezier(.34,1.4,.64,1)}
.f-sprout,.f-bud{display:none;opacity:0}
.stage-stem .f-sprout,
.stage-stem .f-bud,
.stage-bloom .f-bud{display:inline}
.f-sprout,.f-bud{transition:opacity .45s ease}
.f-bud-body{transform-origin:0 0;transition:transform .6s cubic-bezier(.34,1.4,.64,1)}
.f-petals{transition:transform .6s cubic-bezier(.34,1.4,.64,1),opacity .5s ease}
.f-core,.f-ring{transition:opacity .5s ease}
.stage-sprout{--sg:0;--lg:0;--lo:0}
.stage-sprout .f-sprout{display:inline;opacity:1}
.stage-sprout .f-head{transform:translate(50px,44px) scale(0);transform-origin:0 0}
.stage-stem{--sg:.62;--lg:.88;--lo:1}
.stage-stem .f-head{transform:translate(50px,44px) scale(0);transform-origin:0 0}
.stage-bud{--sg:.92;--lg:.97;--lo:1}
.stage-bud .f-bud{display:inline;opacity:1}
.stage-bud .f-bud-body{transform:translateY(var(--bud-drop,5px))}
.stage-bud .f-head{transform:translate(50px,44px) scale(.22);transform-origin:0 0}
.stage-bud .f-petals,.stage-bud .f-core,.stage-bud .f-ring{opacity:0}
.stage-bloom{--sg:1;--lg:1}
.stage-bloom .f-head{transform:translate(50px,44px) scale(var(--bloom,1));transform-origin:0 0;transition:transform var(--unfurl,.9s) cubic-bezier(.3,1.25,.5,1)}
.stage-bloom .f-petals,.stage-bloom .f-core,.stage-bloom .f-ring{transition:transform .6s cubic-bezier(.34,1.4,.64,1),opacity .5s ease .12s}
.stage-bloom .f-bud{transition:opacity .55s ease .1s}</style>
