name: assemble card docs

on:
  push:
    branches:
      - docs/cards-list-candy-lock
    paths:
      - docs/_assemble/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cards-list-candy-lock
          fetch-depth: 1
      - name: assemble and replace stub pages
        run: |
          python3 << 'PY'
          import hashlib
          from pathlib import Path
          root = Path("docs/_assemble")
          KEY = 0xA5
          systems = b"".join(p.read_bytes() for p in sorted(root.glob("03-systems.md.part*")))
          ui = b"".join(p.read_bytes() for p in sorted(root.glob("08-ui-and-layout.md.plainpart*"))).decode()
          def unmask(h):
              return bytes(b ^ KEY for b in bytes.fromhex(h)).decode()
          art = unmask("")
          meter = unmask("85858585f1ccc0d785949685671285909497858a85948995959585d1cad1c4c98585473336473336473336473336473336473334473334473334858585858e939580af")
          if ui.count("[[LAYOUT-ART]]") != 1 or ui.count("[[METER-ART]]") != 1:
              raise SystemExit("art tokens missing")
          ui = ui.replace("[[LAYOUT-ART]]\n", art, 1).replace("[[METER-ART]]\n", meter, 1).encode()
          expect = {
              "docs/03-systems.md": (systems, "984fa2666fd2e6a285e211a338705326fe2d675c3c4dfb1c778ce569a09e7dbd"),
              "docs/08-ui-and-layout.md": (ui, "cc3f22b1ec23b3093c3b5fee97bde69038c1042abce431fd789252b7660f925b"),
          }
          for path, (data, sha) in expect.items():
              got = hashlib.sha256(data).hexdigest()
              if got != sha:
                  raise SystemExit(f"{path} sha {got} != {sha} ({len(data)} bytes)")
              if b"candy-language" not in data:
                  raise SystemExit("missing marker")
              Path(path).write_bytes(data)
              print(f"ok {path} {len(data)} bytes")
          PY
          git config user.name "DeepForestOps"
          git config user.email "ops@deepforestlabs.ai"
          git add docs/03-systems.md docs/08-ui-and-layout.md
          git rm -r docs/_assemble
          git rm -f .github/workflows/assemble-card-docs.yml
          git commit -m "Docs: candy card faces in features and UI"
          git push origin HEAD:docs/cards-list-candy-lock
