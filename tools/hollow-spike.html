<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hollow — full screen</title>
<style>
  :root { --paper: #f7ead1; --ink: #2c1a10; --shadow: 0 4px 0 rgba(44,26,16,.35); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
    font-family: 'Baloo 2', ui-rounded, 'Trebuchet MS', system-ui, sans-serif; font-weight: 700; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 10px 30px; }

  header { width: 100%; max-width: 390px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; flex: 1 0 100%; }
  .pill { border: 3px solid var(--ink); border-radius: 999px; background: #e8d5b0;
    padding: 4px 10px; font-size: 11.5px; box-shadow: var(--shadow); cursor: pointer;
    font-family: inherit; font-weight: 700; color: var(--ink); }
  .pill[data-on="1"] { background: #ffc94a; }
  .pill:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(44,26,16,.35); }

  /* A real phone, so the composition is judged at the shape it ships in. */
  #phone { width: 100%; max-width: 390px; aspect-ratio: 390 / 844; position: relative;
    border: 5px solid var(--ink); border-radius: 34px; overflow: hidden; box-shadow: var(--shadow); }
  #phone svg.hollow-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .nook-pet { position: absolute; width: 19%; transform: translate(-50%, -50%); line-height: 0; }
  .nook-pet svg { width: 100%; overflow: visible; }
  .nook-pet .cr-glow { opacity: .42; }

  .exit-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px; padding: 5px 13px 5px 9px;
    border: 3px solid var(--ink); border-radius: 999px; background: rgba(255,247,225,.92);
    font-size: 11.5px; box-shadow: 0 3px 0 rgba(44,26,16,.28); }
  .exit-hint i { display: block; width: 0; height: 0; border: 5px solid transparent;
    border-bottom-color: var(--ink); animation: nudge-up 2.4s ease-in-out infinite; }
  @keyframes nudge-up { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* The Hollow's own dock — this place has different verbs from the garden. */
  .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 96px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; padding: 9px 9px 16px;
    background: linear-gradient(180deg, rgba(44,26,16,0), rgba(44,26,16,.2) 40%, rgba(44,26,16,.32)); }
  .dock button { position: relative; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; border: 3px solid var(--ink); border-radius: 16px;
    background: #fff7e1; color: var(--ink); font-family: inherit; font-weight: 800; font-size: 10.5px;
    cursor: pointer; box-shadow: 0 3px 0 rgba(44,26,16,.4); padding: 6px 2px; }
  .dock button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(44,26,16,.4); }
  .dock svg { width: 20px; height: 20px; }
  .dock .badge { position: absolute; top: -7px; right: -5px; min-width: 17px; height: 17px;
    border: 2.5px solid var(--ink); border-radius: 999px; background: #ff6b6b; color: #fff;
    font-size: 9.5px; line-height: 12px; }

  .pager { position: absolute; left: 0; right: 0; bottom: 104px; display: flex; justify-content: center; gap: 6px; }
  .pager i { width: 8px; height: 8px; border-radius: 999px; border: 2.5px solid var(--ink);
    background: rgba(255,247,225,.55); display: block; }
  .pager i.on { background: #ffc94a; }
  .arrow { position: absolute; top: 45%; width: 34px; height: 34px; display: grid; place-items: center;
    border: 3px solid var(--ink); border-radius: 999px; background: rgba(255,247,225,.9);
    box-shadow: 0 3px 0 rgba(44,26,16,.3); font-size: 16px; cursor: pointer; }
  .arrow.l { left: 8px; } .arrow.r { right: 8px; }

  #note { width: 100%; max-width: 390px; font-size: 12px; color: #7a6047; line-height: 1.5; }

  .hl-wisp { animation: wisp-drift var(--dur,7s) ease-in-out infinite; animation-delay: var(--delay,0s);
    transform-box: fill-box; transform-origin: center; }
  @keyframes wisp-drift {
    0%,100% { transform: translate(0,0); opacity: .22; } 25% { opacity: .95; }
    50% { transform: translate(var(--dx,10px), var(--dy,-14px)); opacity: .7; } 75% { opacity: .3; }
  }
  .hl-shaft { animation: shaft-breathe 9s ease-in-out infinite; }
  @keyframes shaft-breathe { 0%,100% { opacity: .55; } 50% { opacity: .78; } }
  .hl-dust { animation: dust-fall var(--dur,11s) linear infinite; animation-delay: var(--delay,0s);
    transform-box: fill-box; }
  @keyframes dust-fall {
    0% { transform: translate(0,-10px); opacity: 0; } 15% { opacity: .8; }
    85% { opacity: .45; } 100% { transform: translate(var(--dx,6px), 430px); opacity: 0; }
  }
  .hl-glow { animation: glowpulse 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes glowpulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) {
    .hl-wisp, .hl-shaft, .hl-dust, .hl-glow, .exit-hint i { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>The Hollow — full screen (390 × 844)</h1>
  <button class="pill" id="skyBtn" data-on="1">sunlight</button>
  <button class="pill" id="wispBtn" data-on="1">wisps</button>
  <button class="pill" id="petBtn" data-on="1">pets</button>
  <button class="pill" id="dockBtn" data-on="1">chrome</button>
</header>

<div id="phone"></div>

<p id="note">Portrait, at the size it ships. The bottom 96px belong to the Hollow's own dock, so the
floor sits above it rather than under it. One chamber of six; the arrows and pips stand in for
swiping sideways to the next.</p>

<script src="../data.js"></script>
<script src="../icons.js"></script>
<script src="../critters.js"></script>
<script src="../hollow.js"></script>
<script>
(() => {
  'use strict';
  const INK = '#2c1a10';
  const W = 390, H = 844;
  const DOCK_H = 96;                       // reserved; the floor has to clear it
  const FLOOR_Y = H - DOCK_H - 62;
  const phone = document.getElementById('phone');

  const SKIES = {
    sun:  { beam: '#fffbe8', shaft: '#fff3c4', sky: '#bfe6ff', above: '#8ed36b', aboveDeep: '#6cb551',
            wall: '#d9a86e', wallDeep: '#b8834c', chamber: '#f0c894', floorLip: '#c08d55' },
    moon: { beam: '#f2f6ff', shaft: '#dfe8ff', sky: '#2f3d6b', above: '#5f8f57', aboveDeep: '#456b41',
            wall: '#c99a68', wallDeep: '#a5764a', chamber: '#e2b785', floorLip: '#b07f4d' }
  };
  const state = { sky: 'sun', wisps: true, pets: true, chrome: true };

  const SPOTS = ['bramble', 'pip', 'luna', 'thistle', 'bumble', 'ember']
    .map((id, i) => Object.assign({ id }, Hollow.SPOTS[i]));

  const scene = () => Hollow.scene({
    width: W, height: H, dockHeight: DOCK_H, sky: state.sky, wisps: state.wisps
  });

  const DOCK = [
    { icon: 'honey',  label: 'Feed',     badge: 2 },
    { icon: 'sprout', label: 'Pet' },
    { icon: 'star',   label: 'Loadout',  badge: 1 },
    { icon: 'decor',  label: 'Decorate' }
  ];

  function chrome() {
    if (!state.chrome) return '';
    const ico = (n) => (typeof Icons !== 'undefined' ? Icons.get(n) : '');
    return `<div class="exit-hint"><i></i><span>Swipe up for the garden</span></div>
      <nav class="dock">${DOCK.map((d) => `<button type="button">${ico(d.icon)}<span>${d.label}</span>${
        d.badge ? `<span class="badge">${d.badge}</span>` : ''}</button>`).join('')}</nav>
      <div class="pager"><i class="on"></i><i></i><i></i></div>
      <div class="arrow l">&lsaquo;</div><div class="arrow r">&rsaquo;</div>`;
  }

  function render() {
    phone.innerHTML = scene() + chrome();
    if (!state.pets || typeof CREATURES === 'undefined') return;
    SPOTS.forEach((s) => {
      const def = CREATURES.find((x) => x.id === s.id);
      if (!def) return;
      const n = document.createElement('div');
      n.className = 'nook-pet';
      n.style.left = s.left + '%';
      n.style.top = s.top + '%';
      n.innerHTML = Critters.draw(def);
      phone.appendChild(n);
    });
  }

  document.getElementById('skyBtn').addEventListener('click', (e) => {
    state.sky = state.sky === 'sun' ? 'moon' : 'sun';
    e.currentTarget.textContent = state.sky === 'sun' ? 'sunlight' : 'moonlight';
    render();
  });
  [['wispBtn', 'wisps'], ['petBtn', 'pets'], ['dockBtn', 'chrome']].forEach(([id, key]) => {
    document.getElementById(id).addEventListener('click', (e) => {
      state[key] = !state[key];
      e.currentTarget.dataset.on = state[key] ? '1' : '';
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
