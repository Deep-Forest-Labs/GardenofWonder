<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hollow — art spike</title>
<style>
  :root {
    --paper: #f7ead1;
    --ink: #2c1a10;
    --shadow: 0 4px 0 rgba(44,26,16,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: 'Baloo 2', ui-rounded, 'Trebuchet MS', system-ui, sans-serif; font-weight: 700; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px; }

  header { width: 100%; max-width: 460px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; flex: 1; }
  .pill { border: 3px solid var(--ink); border-radius: 999px; background: #e8d5b0;
    padding: 5px 11px; font-size: 12px; box-shadow: var(--shadow); cursor: pointer;
    font-family: inherit; font-weight: 700; color: var(--ink); }
  .pill[data-on="1"] { background: #ffc94a; }
  .pill:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(44,26,16,.35); }

  #stage { width: 100%; max-width: 460px; border: 4px solid var(--ink); border-radius: 20px;
    overflow: hidden; box-shadow: var(--shadow); position: relative; line-height: 0; }
  #stage svg { width: 100%; display: block; }

  /* Creatures sit in the nooks, positioned as a percentage of the scene. */
  .nook-pet { position: absolute; width: 15%; transform: translate(-50%, -50%); line-height: 0; }
  .nook-pet svg { width: 100%; overflow: visible; }
  .nook-pet .cr-glow { opacity: .45; }

  #note { width: 100%; max-width: 460px; font-size: 12px; color: #7a6047; line-height: 1.5; }

  /* ---- motion: everything slow, nothing blinking ---- */
  .wisp { animation: wisp-drift var(--dur, 7s) ease-in-out infinite; animation-delay: var(--delay, 0s);
    transform-box: fill-box; transform-origin: center; }
  @keyframes wisp-drift {
    0%, 100% { transform: translate(0, 0); opacity: .25; }
    25%      { opacity: .95; }
    50%      { transform: translate(var(--dx, 10px), var(--dy, -14px)); opacity: .7; }
    75%      { opacity: .3; }
  }
  .shaft { animation: shaft-breathe 9s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
  @keyframes shaft-breathe { 0%, 100% { opacity: .5; } 50% { opacity: .72; } }
  .mote-dust { animation: dust-fall var(--dur, 11s) linear infinite; animation-delay: var(--delay, 0s);
    transform-box: fill-box; }
  @keyframes dust-fall {
    0%   { transform: translate(0, -10px); opacity: 0; }
    15%  { opacity: .8; }
    85%  { opacity: .5; }
    100% { transform: translate(var(--dx, 6px), 150px); opacity: 0; }
  }
  .glowpulse { animation: glowpulse 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes glowpulse { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
  @media (prefers-reduced-motion: reduce) {
    .wisp, .shaft, .mote-dust, .glowpulse { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>The Hollow</h1>
  <button class="pill" id="skyBtn" data-on="1">sunlight</button>
  <button class="pill" id="wispBtn" data-on="1">wisps</button>
  <button class="pill" id="petBtn" data-on="1">pets</button>
</header>

<div id="stage"></div>

<p id="note">Under the garden, through a crack in the roots. Warm earth, not stone — the test is
whether it reads as a burrow you would want to sit in, or as a basement.</p>

<script src="../data.js"></script>
<script src="../critters.js"></script>
<script>
(() => {
  'use strict';
  const INK = '#2c1a10';
  const stage = document.getElementById('stage');

  /* Two palettes for the same room. The walls stay warm in both — the whole
     point is that this never reads as stone. Night only cools the light coming
     through the crack, never the earth itself. */
  const SKIES = {
    sun: {
      shaft: '#fff3c4', shaftEdge: '#ffe082', beam: '#fffbe8',
      above: '#8ed36b', aboveDeep: '#6cb551', sky: '#bfe6ff',
      wall: '#d9a86e', wallDeep: '#b8834c', chamber: '#f0c894', floorLip: '#c08d55'
    },
    moon: {
      shaft: '#dfe8ff', shaftEdge: '#b9c9f5', beam: '#f2f6ff',
      above: '#5f8f57', aboveDeep: '#456b41', sky: '#2f3d6b',
      wall: '#c99a68', wallDeep: '#a5764a', chamber: '#e2b785', floorLip: '#b07f4d'
    }
  };

  const state = { sky: 'sun', wisps: true, pets: true };

  /* Wisps: slow, uneven, and never all lit at once. They are the only thing in
     the room that moves quickly enough to notice. */
  const WISPS = [
    { x: 96,  y: 200, r: 8,   dx: 14,  dy: -22, dur: 7.5, delay: 0 },
    { x: 302, y: 172, r: 6.5, dx: -16, dy: -14, dur: 9,   delay: 1.6 },
    { x: 226, y: 232, r: 7.5, dx: 11,  dy: -26, dur: 8.2, delay: 3.1 },
    { x: 138, y: 152, r: 5.5, dx: -10, dy: -12, dur: 10,  delay: 4.4 },
    { x: 340, y: 220, r: 7,   dx: 12,  dy: -18, dur: 8.8, delay: 2.2 },
    { x: 62,  y: 158, r: 5.5, dx: 9,   dy: -15, dur: 11,  delay: 5.5 }
  ];

  /* A root as a filled shape that narrows along its length. Two offset copies of
     the same curve, joined — cheaper than authoring an outline by hand and it
     tapers honestly. */
  function root(d, w0, w1) {
    return `<g>
      <path d="${d}" fill="none" stroke="${INK}" stroke-width="${w0 + 7}" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="#a5764a" stroke-width="${w0}" stroke-linecap="round"/>
      <path d="${d}" fill="none" stroke="#c08d55" stroke-width="${w1}" stroke-linecap="round"
        opacity="0.75" transform="translate(-2 -1)"/>
    </g>`;
  }

  /* A trailing vine with a few leaves. Cheap, and it gives the ceiling something
     to hang so the upper wall is not a blank field of ochre. */
  function vine(x, y, len) {
    const leaf = (ly, dir) => `<ellipse cx="${x + dir * 7}" cy="${y + ly}" rx="7" ry="4"
      fill="#7cc47f" stroke="${INK}" stroke-width="2.5" transform="rotate(${dir * 22} ${x} ${y + ly})"/>`;
    return `<g>
      <path d="M${x} ${y} q 6 ${len / 2} 0 ${len}" fill="none" stroke="#5aa552" stroke-width="4" stroke-linecap="round"/>
      ${leaf(len * 0.32, -1)}${leaf(len * 0.62, 1)}${leaf(len * 0.9, -1)}
    </g>`;
  }

  function wisp(w, c) {
    return `<g class="wisp" style="--dx:${w.dx}px;--dy:${w.dy}px;--dur:${w.dur}s;--delay:${w.delay}s">
      <circle cx="${w.x}" cy="${w.y}" r="${w.r * 3.6}" fill="#ffe9a8" opacity="0.22"/>
      <circle cx="${w.x}" cy="${w.y}" r="${w.r * 2}" fill="#ffe066" opacity="0.42"/>
      <circle cx="${w.x}" cy="${w.y}" r="${w.r}" fill="#fffbe8" stroke="#ffd166" stroke-width="2"/>
    </g>`;
  }

  /* A cap, a stalk and one highlight. Anything more and they stop reading at
     thumbnail size. */
  function mushroom(x, y, s, cap, spot) {
    return `<g transform="translate(${x} ${y}) scale(${s})">
      <path d="M-5 0h10v13a5 5 0 0 1-10 0Z" fill="#fff2dd" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-16 1c0-10 7-16 16-16s16 6 16 16c0 3-32 3-32 0Z" fill="${cap}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-6" cy="-6" r="3.1" fill="${spot}"/>
      <circle cx="6" cy="-8" r="2.4" fill="${spot}"/>
      <circle cx="1" cy="-2" r="2" fill="${spot}"/>
    </g>`;
  }

  function bloom(x, y, s, petal, mid) {
    return `<g transform="translate(${x} ${y}) scale(${s})">
      <path d="M0 0v-9" stroke="#5aa552" stroke-width="2.6" stroke-linecap="round"/>
      ${[0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-13" rx="3.4" ry="5"
        fill="${petal}" stroke="${INK}" stroke-width="1.8" transform="rotate(${a} 0 -9)"/>`).join('')}
      <circle cx="0" cy="-9" r="2.6" fill="${mid}" stroke="${INK}" stroke-width="1.6"/>
    </g>`;
  }

  /* Moss reads as a soft scalloped lip rather than a texture — texture turns to
     noise the moment the scene is scaled down to a phone. */
  function mossLip(x, y, w, n, fill) {
    let d = `M${x} ${y}`;
    const step = w / n;
    for (let i = 0; i < n; i += 1) {
      d += ` q ${step / 2} -${7 + (i % 3) * 2.5} ${step} 0`;
    }
    d += ` v 14 h -${w} Z`;
    return `<path d="${d}" fill="${fill}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
  }

  /* A burrow mouth is dug, not built — so it is a slightly squashed circle with a
     flat mossy floor, rather than the arch the first pass used. Arches read as
     masonry, and one of them read as a headstone. */
  function nook(x, y, rw, rh, c) {
    const floor = y + rh * 0.42;
    return `<g>
      <ellipse cx="${x}" cy="${y}" rx="${rw}" ry="${rh}" fill="${c.wallDeep}"
        stroke="${INK}" stroke-width="4"/>
      <ellipse cx="${x}" cy="${y - rh * 0.1}" rx="${rw - 6}" ry="${rh - 6}" fill="${c.chamber}" opacity="0.5"/>
      <path d="M${x - rw * 0.92} ${floor} a${rw} ${rh} 0 0 0 ${rw * 1.84} 0 v${rh * 0.34} h-${rw * 1.84} Z"
        fill="${c.wallDeep}"/>
      ${mossLip(x - rw * 0.92, floor, rw * 1.84, 4, '#7cc47f')}
      <ellipse cx="${x}" cy="${y}" rx="${rw}" ry="${rh}" fill="none" stroke="${INK}" stroke-width="4"/>
    </g>`;
  }

  /* A cubby for kept mementos — the same dug shape as a burrow mouth, just
     smaller. A plank shelf was tried first and read as a wire strung across the
     wall; reusing the shape language that already works is the cheaper answer
     than inventing a second one. */
  function cubby(x, y, rw, rh, c, items) {
    const floor = y + rh * 0.42;
    return `<g>
      <ellipse cx="${x}" cy="${y}" rx="${rw}" ry="${rh}" fill="${c.wallDeep}" stroke="${INK}" stroke-width="4"/>
      <ellipse cx="${x}" cy="${y - rh * 0.12}" rx="${rw - 5}" ry="${rh - 5}" fill="${c.chamber}" opacity="0.45"/>
      <path d="M${x - rw * 0.9} ${floor} a${rw} ${rh} 0 0 0 ${rw * 1.8} 0 v${rh * 0.34} h-${rw * 1.8} Z" fill="${c.wallDeep}"/>
      ${mossLip(x - rw * 0.9, floor, rw * 1.8, 3, '#7cc47f')}
      ${items}
      <ellipse cx="${x}" cy="${y}" rx="${rw}" ry="${rh}" fill="none" stroke="${INK}" stroke-width="4"/>
    </g>`;
  }

  /* The keepsakes, drawn small enough to read as objects on a shelf rather than
     as icons. Each is the one its creature actually leaves. */
  const KEEPSAKE_ART = {
    pebble: (x, y) => `<ellipse cx="${x}" cy="${y - 5}" rx="9" ry="7" fill="#bcd9b0" stroke="${INK}" stroke-width="3"/>
      <ellipse cx="${x - 3}" cy="${y - 7}" rx="3" ry="2" fill="#8ec48a"/>`,
    button: (x, y) => `<circle cx="${x}" cy="${y - 6}" r="7.5" fill="#ffd6e0" stroke="${INK}" stroke-width="3"/>
      <circle cx="${x - 2.5}" cy="${y - 7}" r="1.4" fill="${INK}"/><circle cx="${x + 2.5}" cy="${y - 7}" r="1.4" fill="${INK}"/>`,
    nail: (x, y) => `<path d="M${x} ${y - 1} l2 -14" stroke="#9aa7b0" stroke-width="4" stroke-linecap="round"/>
      <path d="M${x - 4} ${y - 15} h10" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>`,
    thimble: (x, y) => `<path d="M${x - 6} ${y - 1} l1.5 -11 a5 5 0 0 1 9 0 l1.5 11 Z" fill="#ffd166" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`,
    dust: (x, y) => `<circle cx="${x}" cy="${y - 6}" r="6.5" fill="#e5d6ff" stroke="${INK}" stroke-width="3"/>
      <circle cx="${x - 2}" cy="${y - 8}" r="1.6" fill="#fff"/>`,
    warm: (x, y) => `<ellipse cx="${x}" cy="${y - 5}" rx="8" ry="6.5" fill="#ffc07a" stroke="${INK}" stroke-width="3"/>
      <circle cx="${x}" cy="${y - 5}" r="12" fill="#ffe066" opacity="0.28"/>`
  };

  function scene() {
    const c = SKIES[state.sky];
    const dust = Array.from({ length: 9 }, (_, i) => {
      const x = 176 + Math.round(Math.sin(i * 2.1) * 22) + i * 5;
      return `<circle class="mote-dust" cx="${x}" cy="70" r="${1.6 + (i % 3) * 0.6}" fill="${c.beam}"
        style="--dx:${(i % 2 ? 1 : -1) * (5 + i)}px;--dur:${9 + i * 0.7}s;--delay:${i * 1.2}s"/>`;
    }).join('');

    return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${c.wall}"/>
          <stop offset="100%" stop-color="${c.wallDeep}"/>
        </linearGradient>
        <radialGradient id="chamberG" cx="50%" cy="34%" r="72%">
          <stop offset="0%" stop-color="${c.chamber}"/>
          <stop offset="100%" stop-color="${c.wall}"/>
        </radialGradient>
        <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${c.shaft}" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="${c.shaft}" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- the world above: sky, turf, then a band of earth the roots hang from -->
      <rect width="400" height="300" fill="url(#wallG)"/>
      <rect x="0" y="0" width="400" height="16" fill="${c.sky}"/>
      <path d="M0 8 h400 v16 H0 Z" fill="${c.above}"/>
      <path d="M0 20 q 20 10 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 t 40 0 v10 H0 Z"
        fill="${c.aboveDeep}"/>
      <path d="M0 28 h400 v30 H0 Z" fill="${c.wallDeep}"/>
      <path d="M0 28 h400" stroke="${INK}" stroke-width="3.5"/>

      <!-- the chamber: a warm room carved out of the earth, not a hole in rock -->
      <path d="M14 300 V158 C14 96 98 58 200 58 s186 38 186 100 V300 Z" fill="url(#chamberG)"
        stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>

      <!-- The crack, seen from below. Drawn as a bright gap with dark earth teeth
           hanging DOWN into it, rather than as a jagged outline: in SVG a smaller
           y is higher, so two earlier passes produced upward peaks — which is a
           mountain silhouette, not a hole. Teeth that point down are unambiguous. -->
      <g>
        <path d="M158 40 L172 31 L198 35 L220 30 L242 36 L250 50 L244 62 L166 59 L156 50 Z"
          fill="${c.beam}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
        <path d="M158 40 L172 31 L198 35 L220 30 L242 36 L248 46 L160 46 Z" fill="${c.sky}" opacity="0.8"/>
        <path d="M166 36 L176 58 L187 35 Z" fill="${c.wallDeep}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M197 34 L206 63 L217 33 Z" fill="${c.wallDeep}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M226 33 L233 55 L241 37 Z" fill="${c.wallDeep}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g class="shaft">
        <path d="M170 60 L138 300 H274 L238 60 Z" fill="url(#beamG)"/>
        <path d="M186 60 L166 300 H244 L214 60 Z" fill="${c.beam}" opacity="0.42"/>
      </g>
      ${dust}

      <!-- Roots, drawn as filled tapering shapes rather than strokes. A stroke of
           even width reads as wire; a root has to be fat where it leaves the soil
           and thin where it ends. -->
      ${root('M50 30 C64 74 40 104 56 150 C68 186 46 214 56 252', 22, 5)}
      ${root('M100 30 C108 60 92 78 100 108', 13, 4)}
      ${root('M348 30 C334 78 360 108 342 156 C330 192 350 216 340 252', 21, 5)}
      ${root('M300 30 C292 56 306 72 298 98', 12, 4)}
      ${root('M124 30 C118 48 130 58 124 74', 10, 3.5)}
      ${root('M278 30 C286 48 274 58 280 76', 10, 3.5)}

      <!-- Vines hung from the ceiling arch itself, so they read as growing through
           it rather than floating in front of the wall. -->
      ${vine(160, 68, 40)}
      ${vine(286, 70, 40)}

      <!-- One shelf of kept mementos, on the only genuinely empty wall. The right
           wall already carries the lantern and a root; a second shelf there was
           clutter, and clutter is what made v1 read better. -->
      ${cubby(104, 128, 40, 30, c,
        KEEPSAKE_ART.pebble(88, 138) + KEEPSAKE_ART.nail(105, 139) + KEEPSAKE_ART.button(120, 138))}

      <!-- nooks: one each side, one high up -->
      ${nook(86, 196, 42, 36, c)}
      ${nook(316, 184, 42, 36, c)}
      ${nook(200, 152, 40, 33, c)}

      <!-- a hanging lantern, because a warm room needs a light source of its own -->
      <g>
        <path d="M322 58 v20" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
        <circle class="glowpulse" cx="322" cy="94" r="26" fill="#ffe9a8"/>
        <path d="M312 82 h20 l4 18 a14 14 0 0 1 -28 0 Z" fill="#ffd166" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M310 80 h24" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- the floor: moss, mushrooms, and a few flowers that found the light -->
      <path d="M0 258 q 60 -20 120 -6 t 130 -2 q 80 -8 150 10 V300 H0 Z" fill="${c.floorLip}"
        stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
      ${mossLip(0, 262, 400, 16, '#7cc47f')}
      <path d="M0 276 h400 v24 H0 Z" fill="#5aa552"/>

      ${mushroom(52, 258, 1, '#ff8f6b', '#ffe3d1')}
      ${mushroom(120, 266, 0.72, '#ffb4a2', '#fff2e8')}
      ${mushroom(268, 262, 0.85, '#e0715a', '#ffe3d1')}
      ${mushroom(352, 268, 0.62, '#ff8f6b', '#ffe3d1')}

      ${bloom(94, 262, 1, '#ffc9de', '#ffe066')}
      ${bloom(168, 268, 0.85, '#e5c9ff', '#fff2b8')}
      ${bloom(230, 264, 0.9, '#ffd6a5', '#fff2b8')}
      ${bloom(310, 266, 0.8, '#ffc9de', '#ffe066')}
      ${bloom(390, 262, 0.7, '#e5c9ff', '#fff2b8')}

      ${state.wisps ? WISPS.map((w) => wisp(w, c)).join('') : ''}
    </svg>`;
  }

  /* Real creatures from data.js, so this is a room with its actual tenants in it
     rather than a mood board. */
  const SPOTS = [
    { id: 'pip',     left: 21.5, top: 62 },
    { id: 'luna',    left: 79,   top: 59 },
    { id: 'thistle', left: 50,   top: 49 },
    { id: 'bumble',  left: 64,   top: 82.5 },
    { id: 'bramble', left: 33,   top: 84 }
  ];

  function render() {
    stage.innerHTML = scene();
    if (!state.pets || typeof CREATURES === 'undefined') return;
    SPOTS.forEach((s) => {
      const def = CREATURES.find((c) => c.id === s.id);
      if (!def) return;
      const node = document.createElement('div');
      node.className = 'nook-pet';
      node.style.left = s.left + '%';
      node.style.top = s.top + '%';
      node.innerHTML = Critters.draw(def);
      stage.appendChild(node);
    });
  }

  document.getElementById('skyBtn').addEventListener('click', (e) => {
    state.sky = state.sky === 'sun' ? 'moon' : 'sun';
    e.currentTarget.textContent = state.sky === 'sun' ? 'sunlight' : 'moonlight';
    render();
  });
  document.getElementById('wispBtn').addEventListener('click', (e) => {
    state.wisps = !state.wisps;
    e.currentTarget.dataset.on = state.wisps ? '1' : '';
    render();
  });
  document.getElementById('petBtn').addEventListener('click', (e) => {
    state.pets = !state.pets;
    e.currentTarget.dataset.on = state.pets ? '1' : '';
    render();
  });

  render();
})();
</script>
</body>
</html>
