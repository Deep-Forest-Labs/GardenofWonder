<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#7ec8f2"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <!-- `default`, NOT `black-translucent`. Translucent hands an installed iOS app a
       window the height of the screen MINUS the status bar and then pins it to the
       top, so the game drew under the clock and left a dead strip along the bottom
       that nothing in the page can reach — measured on an iPhone 16 Pro: screen
       874, window 812, top inset 62. `default` puts the window below the status
       bar instead, where it reaches the bottom of the screen and the dock can sit
       where a dock belongs. The status bar strip takes `theme-color`, which
       `updateSky()` keeps on the current sky. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Garden Wonder"/>
  <meta name="description" content="A cozy tap-and-grow garden full of talking flowers."/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <title>Garden Wonder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="game" id="game">
    <!-- Everything the shake moves lives in .world, so .game itself stays an
         untransformed fixed box. A transform on .game made it its own containing
         block, and that is the shape of box iOS has twice sized short of the
         home indicator. -->
    <div class="world" id="world">

      <!-- ============ PARALLAX SCENERY ============ -->
      <div class="scenery" id="scenery" aria-hidden="true">
        <div class="sky" id="sky"></div>
        <div class="celestial" id="celestial"></div>
        <div class="stars" id="stars"></div>
        <div class="layer clouds-far" id="cloudsFar"></div>
        <div class="layer hills-far"></div>
        <div class="layer clouds-near" id="cloudsNear"></div>
        <div class="layer hills-mid"></div>
        <div class="layer hills-near"></div>
        <div class="layer meadow"></div>
        <div class="layer fence"></div>
        <div class="vignette"></div>
        <!-- The year ripening. A real layer rather than a pseudo-element because
             ::after already carries the weather and ::before would paint under
             the sky. Both are multiply overlays and both can be on at once. -->
        <div class="season-tint" id="seasonTint"></div>
      </div>

      <!-- Fall's scene. A season is not a place layer in this game: the HUD, the
           quest strip, the rail and the dock never move, `.stage` swaps its board
           and the scenery swaps behind it. So this sits above the CSS scenery and
           below `.ui`, and nothing here re-states the 560px column because it
           never leaves it. -->
      <div class="fall-layer" id="fallLayer" hidden aria-hidden="true">
        <div class="fall-scene-host" id="fallScene"></div>
      </div>
      <!-- A locked season, seen from the gate. Above `.ui`'s scenery for the same
           reason, and it hides the garden's own chrome while it is up. -->
      <div class="gate-layer" id="gateLayer" hidden aria-label="A locked season"></div>

      <div class="wonder-veil" id="wonderVeil" aria-hidden="true"></div>
      <canvas class="fx-canvas" id="fx" aria-hidden="true"></canvas>

      <!-- ============ INTERFACE ============ -->
      <div class="ui" id="ui">
        <header class="hud">
          <div class="wallets">
            <div class="wallet" id="walletCredits"><span class="w-icon" data-icon="coin"></span><span class="w-num" id="credits">0</span></div>
            <div class="wallet" id="walletGems"><span class="w-icon" data-icon="gem"></span><span class="w-num" id="gems">0</span></div>
            <button class="dev-dot" id="btnDev" type="button" aria-label="Developer tools" tabindex="-1"></button>
          </div>
          <!-- Two wallets and two round buttons since phase 3.5. The year meter
               moved into the dock's Turn button, whose body IS the meter, and the
               album star moved to the Cards button. That is what buys the round
               buttons back to 44px at 390px wide — see the max-width:430px block
               in style.css, which asked for exactly this. -->
          <div class="hud-actions">
            <button class="round-btn" id="btnBonuses" aria-label="Garden almanac and bonuses"><span data-icon="book"></span></button>
            <button class="round-btn" id="btnSettings" aria-label="Settings"><span data-icon="gear"></span></button>
          </div>
        </header>

        <button class="quest-strip" id="questStrip" type="button" aria-label="Current quest">
          <span class="q-pip-wrap" id="qPipWrap">
            <span class="q-pip-ring"></span>
            <span class="q-pip" id="qPip">1</span>
          </span>
          <span class="q-bar">
            <i id="qBar"></i>
            <span class="q-bar-label">
              <span class="q-text" id="qText">Tap 25 times</span>
              <span class="q-count" id="qCount">0 / 25</span>
            </span>
          </span>
          <span class="q-reward" id="qReward"></span>
        </button>

        <div class="rail" id="rail" aria-live="polite"></div>

        <main class="stage" id="stage">
          <div class="garden-frame">
            <div class="garden" id="garden" aria-label="Your garden"></div>
          </div>
          <div class="fall-frame" id="fallFrame">
            <div class="fl-wrap">
              <div class="fl-chip" id="fallChip"></div>
              <div class="fl-board" id="fallBoard" aria-label="Fall's bed"></div>
            </div>
          </div>
          <div class="critter-yard" id="critterYard" aria-label="Creatures living in your garden"></div>
          <!-- THE BAND. One row between the garden and the dock, reading left to
               right: UPGRADE, the tending creatures, POWER-UP. It costs the
               layout nothing, because it lives in the yard `.stage` already
               reserves for the creatures. Both buttons are inset past the season
               edge tabs, which keep the screen edges they have always had. -->
          <button class="fpill" id="btnUpgrade" type="button" aria-label="Upgrades">
            <span class="f-ico" data-icon="badge"></span>
            <span class="f-lab">UPGRADE</span>
            <span class="dock-dot" hidden></span>
          </button>
          <button class="fround" id="btnPower" type="button" aria-label="Power-up"></button>
        </main>
        <section class="hollow" id="hollow" aria-label="The Hollow" hidden></section>

        <div class="season-edges" id="seasonEdges" aria-hidden="false"></div>

        <!-- THE BIG FIVE. Orders & Quests, Cards, GARDEN, Turn, Shop — the
             owner's dock, specced in docs/36. The centre is a raised pedestal
             and the fourth button's own body is the year meter. -->
        <nav class="dock five" id="dock" aria-label="Menu">
          <button class="dock-btn" data-tab="orders">
            <span class="dock-ico" data-icon="orders"></span>
            <span class="dock-label">Orders<br>&amp; Quests</span>
            <span class="dock-dot" hidden></span>
          </button>
          <button class="dock-btn" data-tab="album">
            <span class="dock-ico" data-icon="cards"></span>
            <span class="dock-label">Cards</span>
            <span class="dock-dot" hidden></span>
          </button>
          <!-- The pedestal is taller than the dock's row and the row is
               align-items:end, so it rises out of the top without changing row
               5's height. Nothing else in the .ui grid is re-measured. -->
          <button class="dock-btn home" data-tab="garden" aria-label="Back to the garden">
            <span class="dock-ico" data-icon="sprout"></span>
            <span class="dock-label">GARDEN</span>
          </button>
          <!-- The button's body IS the year meter: it fills on the binding gate
               and breathes when a Turn is ready. -->
          <button class="dock-btn turn" data-tab="year">
            <i class="turn-fill" id="yearFill"></i>
            <span class="seedchip" id="pouchChip" hidden></span>
            <span class="dock-ico" data-icon="pouch"></span>
            <span class="dock-label">Turn</span>
            <span class="dock-dot" hidden></span>
          </button>
          <button class="dock-btn" data-tab="shop">
            <span class="dock-ico" data-icon="decor"></span>
            <span class="dock-label">Shop</span>
            <span class="dock-dot" hidden></span>
          </button>
        </nav>
      </div>

      <!-- ============ BOTTOM SHEET ============ -->
      <div class="scrim" id="scrim" hidden></div>
      <section class="sheet" id="sheet" aria-hidden="true" aria-label="Shop">
        <!-- Breaks out ABOVE the sheet's top edge, so whoever the panel is about
             is standing on it rather than filed inside it. Absolutely positioned
             on the sheet, not in the scrolling body, so it stays put. -->
        <div class="sheet-art" id="sheetArt" aria-hidden="true" hidden></div>
        <div class="sheet-grip" id="sheetGrip"><span></span></div>
        <div class="sheet-head">
          <h2 id="sheetTitle">Upgrades</h2>
          <button class="round-btn ghost" id="sheetClose" aria-label="Close"><span data-icon="close"></span></button>
        </div>
        <div class="sheet-tabs" id="sheetTabs"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </section>

      <!-- ============ OVERLAYS ============ -->
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="banner" id="banner" aria-hidden="true"></div>
      <div class="meadow-layer" id="meadow" aria-label="The Wild Meadow" hidden></div>
      <div class="coach" id="coach" hidden></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="flora.js"></script>
  <script src="critters.js"></script>
  <script src="customers.js"></script>
  <script src="hollow.js"></script>
  <script src="meadow.js"></script>
  <script src="fall.js"></script>
  <script src="icons.js"></script>
  <script src="audio.js"></script>
  <script src="fx.js"></script>
  <script src="game.js"></script>
  <script src="ui-shared.js"></script>
  <script src="ui-scenery.js"></script>
  <script src="ui-sheet.js"></script>
  <script src="ui-hollow.js"></script>
  <script src="ui-meadow.js"></script>
  <script src="ui-fall.js"></script>
  <script src="ui-events.js"></script>
  <script src="ui.js"></script>

  <script>
    /* Registers the service worker that makes the game installable and playable
       offline. Skipped on localhost and file:// so local iteration never serves a
       stale file — add ?sw to the URL when you want to exercise it locally. */
    if ('serviceWorker' in navigator) {
      var swLocal = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1;
      var swForce = location.search.indexOf('sw') !== -1;
      if (!swLocal || swForce) {
        addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
            .catch(function () { /* offline play is a bonus, never a requirement */ });
        });
      } else {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
      }
    }
  </script>
</body>
</html>
