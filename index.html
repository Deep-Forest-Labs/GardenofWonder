<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#7ec8f2"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <!-- `default`, NOT `black-translucent`. Translucent hands an installed iOS app a
       window the height of the screen MINUS the status bar and then pins it to the
       top, so the game drew under the clock and left a dead strip along the bottom
       that nothing in the page can reach — measured on an iPhone 16 Pro: screen
       874, window 812, top inset 62. `default` puts the window below the status
       bar instead, where it reaches the bottom of the screen and the dock can sit
       where a dock belongs. The status bar strip takes `theme-color`, which
       `updateSky()` keeps on the current sky. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Garden Wonder"/>
  <meta name="description" content="A cozy tap-and-grow garden full of talking flowers."/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
  <title>Garden Wonder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="game" id="game">
    <!-- Everything the shake moves lives in .world, so .game itself stays an
         untransformed fixed box. A transform on .game made it its own containing
         block, and that is the shape of box iOS has twice sized short of the
         home indicator. -->
    <div class="world" id="world">

      <!-- ============ PARALLAX SCENERY ============ -->
      <div class="scenery" id="scenery" aria-hidden="true">
        <!-- Everything above the lawn, in one box, so Wonderfall's breathing warp is
             ONE filter rather than eight. It cannot go on `.scenery` itself: a filter
             cannot carry a mask, `.scenery` owns the bottom edge, and a warp reaching
             the edge draws the iOS strip join three rounds of layout went into hiding.
             `.meadow`, `.fence`, `.vignette` and `.season-tint` stay outside it for
             exactly that reason. The box is `inset:0` like `.scenery`, so every
             percentage inside resolves against the same rectangle it always did. -->
        <div class="scenery-warp">
          <div class="sky" id="sky"></div>
          <div class="celestial" id="celestial"></div>
          <div class="stars" id="stars"></div>
          <div class="layer clouds-far" id="cloudsFar"></div>
          <div class="layer hills-far"></div>
          <div class="layer clouds-near" id="cloudsNear"></div>
          <div class="layer hills-mid"></div>
          <div class="layer hills-near"></div>
        </div>
        <!-- The fence is the world too, so it takes the rain on itself:
             `.wx-wet` is an opt-in hook the stylesheet decides when to darken,
             never a state this markup knows about.

             NOT the lawn. `.wx-wet` darkens with a `filter`, and a filter cannot
             carry a mask — the lawn reaches the bottom edge, and the strip iOS
             paints below a short window is filled with the untinted lawn colour,
             so darkening it here would draw the join three rounds of layout work
             went into hiding. `.wx-ground` wets the lower scene instead: it is a
             masked multiply inside `.wx`, which is what that layer is for. -->
        <div class="layer meadow"></div>
        <div class="layer fence wx-wet"></div>
        <div class="vignette"></div>
        <!-- The year ripening. A real layer rather than a pseudo-element because
             ::after already carries the weather and ::before would paint under
             the sky. Both are multiply overlays and both can be on at once. -->
        <div class="season-tint" id="seasonTint"></div>
      </div>

      <!-- ============ THE SKY PASS ============
           The staged weather, above the living sky and below the interface.
           It carries NO z-index and nothing may give it one: a positioned
           element with a z-index is a stacking context, and a stacking context
           is an isolated blending group — every multiply, screen and overlay
           inside would blend against transparency instead of against the sky.
           DOM order alone places it, and the siblings above carry their own.
           `isolation`, `opacity` under 1, `filter` and `transform` on this box
           are the same bug spelled differently. Layer order is load-bearing:
           the stylesheet drives the clouds, the ribbons and the rays off
           `:nth-child`. -->
      <div class="wx" id="wx" aria-hidden="true">
        <div class="wx-wash"></div>
        <div class="wx-front">
          <i class="wx-front-cloud"></i><i class="wx-front-cloud"></i><i class="wx-front-cloud"></i>
          <i class="wx-front-cloud"></i><i class="wx-front-cloud"></i><i class="wx-front-cloud"></i>
        </div>
        <div class="wx-bolt"></div>
        <div class="wx-dusk"></div>
        <div class="wx-ribbons">
          <i class="wx-ribbon" style="--i:0"></i>
          <i class="wx-ribbon" style="--i:1"></i>
          <i class="wx-ribbon" style="--i:2"></i>
        </div>
        <div class="wx-ground"></div>
        <div class="wx-veil"></div>
        <div class="wx-takeover"></div>
        <div class="wx-sunbreak">
          <i class="wx-ray"></i><i class="wx-ray"></i><i class="wx-ray"></i><i class="wx-ray"></i>
        </div>
        <div class="wx-flash-under"></div>
      </div>

      <!-- Fall's scene. A season is not a place layer in this game: the HUD, the
           quest strip, the rail and the dock never move, `.stage` swaps its board
           and the scenery swaps behind it. So this sits above the CSS scenery and
           below `.ui`, and nothing here re-states the 560px column because it
           never leaves it. -->
      <div class="fall-layer" id="fallLayer" hidden aria-hidden="true">
        <div class="fall-scene-host" id="fallScene"></div>
      </div>
      <div class="winter-layer" id="winterLayer" hidden aria-hidden="true">
        <div class="winter-scene-host" id="winterScene"></div>
      </div>
      <!-- A locked season, seen from the gate. Above `.ui`'s scenery for the same
           reason, and it hides the garden's own chrome while it is up. -->
      <div class="gate-layer" id="gateLayer" hidden aria-label="A locked season"></div>

      <div class="wonder-veil" id="wonderVeil" aria-hidden="true"></div>
      <canvas class="fx-canvas" id="fx" aria-hidden="true"></canvas>

      <!-- ============ INTERFACE ============ -->
      <div class="ui" id="ui">
        <header class="hud">
          <div class="wallets">
            <div class="wallet" id="walletCredits"><span class="w-icon" data-icon="coin"></span><span class="w-num" id="credits">0</span></div>
            <div class="wallet" id="walletGems"><span class="w-icon" data-icon="gem"></span><span class="w-num" id="gems">0</span></div>
            <button class="dev-dot" id="btnDev" type="button" aria-label="Developer tools" tabindex="-1"></button>
          </div>
          <!-- Two wallets and two round buttons since phase 3.5. The year meter
               moved into the dock's Turn button, whose body IS the meter, and the
               album star moved to the Cards button. That is what buys the round
               buttons back to 44px at 390px wide — see the max-width:430px block
               in style.css, which asked for exactly this. -->
          <!-- The gear became the hamburger on 2026-08-31. A gear promises one
               panel and the menu holds seven things, so the glyph had to change
               or the button would be lying; Settings is a row inside it now and
               every control it used to reach is one tap deeper. The dot is the
               dock's attention dot on a HUD button for the first time, and it
               is a child of the button, which is why .round-btn is positioned. -->
          <div class="hud-actions">
            <button class="round-btn" id="btnBonuses" aria-label="Garden almanac and bonuses"><span data-icon="book"></span></button>
            <button class="round-btn" id="btnMenu" aria-label="Menu" aria-expanded="false"><span data-icon="menu"></span><i class="hud-dot" id="menuDot" hidden></i></button>
          </div>
        </header>

        <button class="quest-strip" id="questStrip" type="button" aria-label="Current quest">
          <span class="q-pip-wrap" id="qPipWrap">
            <span class="q-pip-ring"></span>
            <span class="q-pip" id="qPip">1</span>
          </span>
          <span class="q-bar">
            <i id="qBar"></i>
            <span class="q-bar-label">
              <span class="q-text" id="qText">Tap 25 times</span>
              <span class="q-count" id="qCount">0 / 25</span>
            </span>
          </span>
          <span class="q-reward" id="qReward"></span>
        </button>

        <div class="rail" id="rail" aria-live="polite"></div>

        <main class="stage" id="stage">
          <div class="garden-frame">
            <div class="garden" id="garden" aria-label="Your garden"></div>
          </div>
          <div class="fall-frame" id="fallFrame">
            <div class="fl-wrap">
              <div class="fl-chip" id="fallChip"></div>
              <div class="fl-board" id="fallBoard" aria-label="Fall's bed"></div>
              <!-- Absolutely positioned against the wrap, never a row in it. A
                   button that appears in a centring grid grows the wrap and
                   slides the board up — a jump at the exact instant the player
                   is looking at the board. Its strip is reserved whether it is
                   showing or not. -->
              <button class="fl-collect" id="fallCollect" type="button" hidden></button>
            </div>
          </div>
          <div class="winter-frame" id="winterFrame">
            <div class="wi-wrap">
              <div class="wi-chip" id="winterChip"></div>
              <div class="wi-board" id="winterBoard" aria-label="Winter's bed"></div>
              <!-- ONE button, and its verb is the bed's state: Tuck the bed in →
                   Tucked in → Collect all. Absolutely positioned against the
                   wrap for the same reason Fall's is, and it is the same 132px
                   strip: the band's UPGRADE and POWER-UP are not hidden here
                   either, so a second control would fight it for the clearance. -->
              <button class="wi-act" id="winterAct" type="button" hidden></button>
            </div>
          </div>
          <div class="critter-yard" id="critterYard" aria-label="Creatures living in your garden"></div>
          <!-- THE BAND. One row between the garden and the dock, reading left to
               right: UPGRADE, the tending creatures, POWER-UP. It costs the
               layout nothing, because it lives in the yard `.stage` already
               reserves for the creatures. Both buttons are inset past the season
               edge tabs, which keep the screen edges they have always had. -->
          <button class="fpill" id="btnUpgrade" type="button" aria-label="Upgrades">
            <span class="f-ico" data-icon="badge"></span>
            <span class="f-lab">UPGRADE</span>
            <span class="dock-dot" hidden></span>
          </button>
          <button class="fround" id="btnPower" type="button" aria-label="Power-up"></button>
        </main>
        <section class="hollow" id="hollow" aria-label="The Hollow" hidden></section>

        <div class="season-edges" id="seasonEdges" aria-hidden="false"></div>

        <!-- THE BIG FIVE. Orders & Quests, Cards, GARDEN, Turn, Shop — the
             owner's dock, specced in docs/36. The centre is a raised pedestal
             and the fourth button's own body is the year meter. -->
        <nav class="dock five" id="dock" aria-label="Menu">
          <button class="dock-btn" data-tab="orders">
            <span class="dock-ico" data-icon="orders"></span>
            <span class="dock-label">Orders<br>&amp; Quests</span>
            <span class="dock-dot" hidden></span>
          </button>
          <button class="dock-btn" data-tab="album">
            <span class="dock-ico" data-icon="cards"></span>
            <span class="dock-label">Cards</span>
            <span class="dock-dot" hidden></span>
          </button>
          <!-- The pedestal is taller than the dock's row and the row is
               align-items:end, so it rises out of the top without changing row
               5's height. Nothing else in the .ui grid is re-measured. -->
          <button class="dock-btn home" data-tab="garden" aria-label="Back to the garden">
            <span class="dock-ico" data-icon="sprout"></span>
            <span class="dock-label">GARDEN</span>
          </button>
          <!-- The button's body IS the year meter: it fills on the binding gate
               and breathes when a Turn is ready. -->
          <button class="dock-btn turn" data-tab="year">
            <i class="turn-fill" id="yearFill"></i>
            <span class="seedchip" id="pouchChip" hidden></span>
            <span class="dock-ico" data-icon="pouch"></span>
            <span class="dock-label">Turn</span>
            <span class="dock-dot" hidden></span>
          </button>
          <button class="dock-btn" data-tab="shop">
            <span class="dock-ico" data-icon="decor"></span>
            <span class="dock-label">Shop</span>
            <span class="dock-dot" hidden></span>
          </button>
        </nav>
      </div>

      <!-- Above the interface, because a flash that does not silhouette the
           garden is a grey rectangle. The flower's leaf-over-the-head is the
           flower's OWN leaf, animated in place — the spike carried a drawn
           stand-in for stages that had no talking flower on them, and this one
           always does. -->
      <div class="wx-flash" id="wxFlash"></div>

      <!-- ============ BOTTOM SHEET ============ -->
      <div class="scrim" id="scrim" hidden></div>
      <section class="sheet" id="sheet" aria-hidden="true" aria-label="Shop">
        <!-- Breaks out ABOVE the sheet's top edge, so whoever the panel is about
             is standing on it rather than filed inside it. Absolutely positioned
             on the sheet, not in the scrolling body, so it stays put. -->
        <div class="sheet-art" id="sheetArt" aria-hidden="true" hidden></div>
        <div class="sheet-grip" id="sheetGrip"><span></span></div>
        <div class="sheet-head">
          <h2 id="sheetTitle">Upgrades</h2>
          <button class="round-btn ghost" id="sheetClose" aria-label="Close"><span data-icon="close"></span></button>
        </div>
        <div class="sheet-tabs" id="sheetTabs"></div>
        <div class="sheet-body" id="sheetBody"></div>
      </section>

      <!-- ============ THE MENU DRAWER ============
           A third surface class, and not a sheet: it comes in from the RIGHT,
           holds a menu rather than a panel, and is dismissed rightward. It has
           its own scrim because #scrim is wired straight to closeSheet(), and
           it is a SIBLING of .ui rather than a child — a child would be painted
           over by the FX float layer above it — so, like the sheet and the
           meadow, it has to re-state the 560px column itself. Full height, so
           it pays the whole top and bottom inset rather than the shaved
           --bottom-gap a row of buttons takes. See docs/08-ui-and-layout.md. -->
      <div class="scrim drawer-scrim" id="menuScrim" hidden></div>
      <aside class="drawer" id="menu" aria-hidden="true" aria-label="Menu" hidden>
        <div class="dr-grip" id="menuGrip"><span></span></div>
        <div class="dr-head" id="menuHead"></div>
        <div class="dr-body" id="menuBody"></div>
      </aside>

      <!-- ============ OVERLAYS ============ -->
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="banner" id="banner" aria-hidden="true"></div>
      <div class="meadow-layer" id="meadow" aria-label="The Wild Meadow" hidden></div>
      <div class="coach" id="coach" hidden></div>
      <!-- The sky chip's tooltip. A sibling of the coach and NOT a child of the
           rail: the rail's signature carries every countdown, so it rewrites its
           whole markup about once a second and would eat anything anchored
           inside it. It borrows the coach's arrow-and-bubble shape rather than
           inventing a second callout, and none of the coach's machinery — it is
           placed by its own tap and closed by the next one. -->
      <div class="coach weather-tip" id="wxTip" hidden></div>
    </div>

    <!-- WHAT'S NEW. Outside `.world` on purpose: FX builds its float layer as a
         child of `.game`, so anything inside `.world` can be painted over by a
         coin float from a harvest that landed while the dialog was up. This is
         the one thing in the game a player cannot swipe away — nothing may draw
         on top of it. -->
    <div class="news" id="news" hidden aria-hidden="true"></div>
  </div>

  <script src="data.js"></script>
  <script src="flora.js"></script>
  <script src="critters.js"></script>
  <script src="customers.js"></script>
  <script src="hollow.js"></script>
  <script src="meadow.js"></script>
  <script src="fall.js"></script>
  <script src="winter.js"></script>
  <script src="icons.js"></script>
  <script src="audio.js"></script>
  <script src="fx.js"></script>
  <script src="game.js"></script>
  <script src="ui-shared.js"></script>
  <script src="ui-scenery.js"></script>
  <!-- Before ui-events.js, not after. Both subscribe to `weather`, and the tail
       of an ending sky has to be standing before that file asks paintWeather()
       to hand the attribute over. -->
  <script src="ui-weather.js"></script>
  <script src="ui-sheet.js"></script>
  <script src="ui-hollow.js"></script>
  <script src="ui-meadow.js"></script>
  <script src="ui-fall.js"></script>
  <script src="ui-winter.js"></script>
  <script src="ui-news.js"></script>
  <script src="ui-menu.js"></script>
  <script src="ui-events.js"></script>
  <!-- The frame-rate readout. A development instrument: it starts off, the dev
       sheet is its only switch, and nothing shipped ever shows it. -->
  <script src="ui-perf.js"></script>
  <script src="ui.js"></script>

  <script>
    /* Registers the service worker that makes the game installable and playable
       offline. Skipped on localhost and file:// so local iteration never serves a
       stale file — add ?sw to the URL when you want to exercise it locally. */
    if ('serviceWorker' in navigator) {
      var swLocal = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1;
      var swForce = location.search.indexOf('sw') !== -1;
      if (!swLocal || swForce) {
        addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
            .catch(function () { /* offline play is a bonus, never a requirement */ });
        });
      } else {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        });
      }
    }
  </script>
</body>
</html>
