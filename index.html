<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#7ec8f2"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Garden Wonder"/>
  <meta name="description" content="A cozy tap-and-grow garden full of talking flowers."/>
  <title>Garden Wonder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="game" id="game">

    <!-- ============ PARALLAX SCENERY ============ -->
    <div class="scenery" id="scenery" aria-hidden="true">
      <div class="sky" id="sky"></div>
      <div class="celestial" id="celestial"></div>
      <div class="stars" id="stars"></div>
      <div class="layer clouds-far" id="cloudsFar"></div>
      <div class="layer hills-far"></div>
      <div class="layer clouds-near" id="cloudsNear"></div>
      <div class="layer hills-mid"></div>
      <div class="layer hills-near"></div>
      <div class="layer meadow"></div>
      <div class="layer fence"></div>
      <div class="vignette"></div>
    </div>

    <div class="wonder-veil" id="wonderVeil" aria-hidden="true"></div>
    <canvas class="fx-canvas" id="fx" aria-hidden="true"></canvas>

    <!-- ============ INTERFACE ============ -->
    <div class="ui" id="ui">
      <header class="hud">
        <div class="wallets">
          <div class="wallet" id="walletCredits"><span class="w-icon" data-icon="coin"></span><span class="w-num" id="credits">0</span></div>
          <div class="wallet" id="walletGems"><span class="w-icon" data-icon="gem"></span><span class="w-num" id="gems">0</span></div>
          <button class="dev-dot" id="btnDev" type="button" aria-label="Developer tools" tabindex="-1"></button>
        </div>
        <div class="hud-actions">
          <button class="round-btn" id="btnBonuses" aria-label="Garden almanac and bonuses"><span data-icon="book"></span></button>
          <button class="round-btn" id="btnSettings" aria-label="Settings"><span data-icon="gear"></span></button>
        </div>
      </header>

      <button class="quest-strip" id="questStrip" type="button" aria-label="Current quest">
        <span class="q-pip-wrap" id="qPipWrap">
          <span class="q-pip-ring"></span>
          <span class="q-pip" id="qPip">1</span>
        </span>
        <span class="q-bar">
          <i id="qBar"></i>
          <span class="q-bar-label">
            <span class="q-text" id="qText">Tap 25 times</span>
            <span class="q-count" id="qCount">0 / 25</span>
          </span>
        </span>
        <span class="q-reward" id="qReward"></span>
      </button>

      <div class="rail" id="rail" aria-live="polite"></div>

      <main class="stage" id="stage">
        <div class="garden-frame">
          <div class="garden" id="garden" aria-label="Your garden"></div>
        </div>
      </main>

      <nav class="dock" id="dock" aria-label="Shops">
        <button class="dock-btn" data-tab="upgrades">
          <span class="dock-ico" data-icon="badge"></span>
          <span class="dock-label">Upgrades</span>
          <span class="dock-dot" hidden></span>
        </button>
        <button class="dock-btn" data-tab="apiary">
          <span class="dock-ico" data-icon="hive"></span>
          <span class="dock-label">Apiary</span>
          <span class="dock-dot" hidden></span>
        </button>
        <button class="dock-btn" data-tab="craft">
          <span class="dock-ico" data-icon="flask"></span>
          <span class="dock-label">Craft</span>
          <span class="dock-dot" hidden></span>
        </button>
        <button class="dock-btn" data-tab="shop">
          <span class="dock-ico" data-icon="decor"></span>
          <span class="dock-label">Shop</span>
          <span class="dock-dot" hidden></span>
        </button>
      </nav>
    </div>

    <!-- ============ BOTTOM SHEET ============ -->
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" aria-hidden="true" aria-label="Shop">
      <div class="sheet-grip" id="sheetGrip"><span></span></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Upgrades</h2>
        <button class="round-btn ghost" id="sheetClose" aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="sheet-tabs" id="sheetTabs"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <!-- ============ OVERLAYS ============ -->
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="banner" id="banner" aria-hidden="true"></div>
    <div class="coach" id="coach" hidden></div>
  </div>

  <script src="data.js"></script>
  <script src="flora.js"></script>
  <script src="icons.js"></script>
  <script src="audio.js"></script>
  <script src="fx.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
